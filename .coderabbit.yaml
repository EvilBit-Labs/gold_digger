# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-US
tone_instructions: "MySQL/MariaDB CLI query tool in Rust. Focus on security (credential redaction, TLS), safe database value conversions (no panics on NULL), proper error handling with anyhow, and structured exit codes."
early_access: true
enable_free_tier: true

reviews:
  profile: assertive
  request_changes_workflow: true
  high_level_summary: true
  high_level_summary_placeholder: "@coderabbitai summary"
  high_level_summary_in_walkthrough: true
  auto_title_placeholder: "@coderabbitai"
  auto_title_instructions: "Generate PR/MR titles following Conventional Commits format: type(scope): description. Use types: feat, fix, docs, style, refactor, perf, test, build, ci, chore. Use scopes: cli, db, tls, csv, json, tsv, config, ci, deps. Keep descriptions concise and action-oriented."
  review_status: true
  commit_status: true
  fail_commit_status: false
  collapse_walkthrough: true
  changed_files_summary: true
  sequence_diagrams: true
  estimate_code_review_effort: true
  assess_linked_issues: true
  related_issues: true
  related_prs: true
  suggested_labels: true
  auto_apply_labels: true
  suggested_reviewers: true
  auto_assign_reviewers: false
  path_filters:
    - "src/**"
    - "tests/**"
    - "docs/src/**"
    - ".github/**"
    - "!.github/workflows/release.yml"
    - ".cursor/**/*.mdc"
    - "*.md"
    - "*.toml"
    - "*.yaml"
    - "*.yml"
    - "*.json"
    - "*.sh"
    - "justfile"
    - "!target/**"
    - "!docs/book/**"
    - "!node_modules/**"
    - "!*.woff2"
    - "!*.png"
    - "!*.svg"
    - "!*.ico"
  labeling_instructions:
    - label: rust
      instructions: Apply when the PR/MR contains changes to Rust source code files (src/**/*.rs, tests/**/*.rs, benches/**/*.rs).
    - label: dependencies
      instructions: Apply when the PR/MR updates Cargo.toml, Cargo.lock, or package.json dependency files.
    - label: github_actions
      instructions: Apply when the PR/MR contains changes to GitHub Actions workflow files (.github/workflows/**/*.yml).
    - label: documentation
      instructions: Apply when the PR/MR contains changes to documentation files (docs/**/*.md, README.md, CHANGELOG.md, *.md).
    - label: category/security
      instructions: Apply when the PR/MR addresses security vulnerabilities, implements security features, or modifies security-related code (TLS configuration, credential handling, authentication).
    - label: category/ci-cd
      instructions: Apply when the PR/MR modifies CI/CD pipelines, GitHub Actions workflows, or release processes.
    - label: category/testing
      instructions: Apply when the PR/MR adds, modifies, or improves tests (tests/**/*.rs, test fixtures, test utilities).
    - label: category/docs
      instructions: Apply when the PR/MR improves documentation, adds examples, or updates user guides.
    - label: category/code-quality
      instructions: Apply when the PR/MR improves code quality, refactors code, fixes linting issues, or improves error handling.
    - label: category/release
      instructions: Apply when the PR/MR modifies release processes, versioning, or distribution configuration.
    - label: type/enhancement
      instructions: Apply when the PR/MR adds new features, improves functionality, or extends existing capabilities.
    - label: type/chore
      instructions: Apply when the PR/MR performs maintenance tasks, updates configuration files, or makes infrastructure changes without changing core functionality.
  abort_on_close: true
  disable_cache: false
  auto_review:
    enabled: true
    auto_incremental_review: true
    ignore_title_keywords: ["WIP", "draft", "do not merge"]
    drafts: false
    base_branches: ["main"]
    ignore_usernames: []
  finishing_touches:
    docstrings:
      enabled: true
    unit_tests:
      enabled: true
  pre_merge_checks:
    docstrings:
      mode: warning
      threshold: 80
    title:
      mode: warning
      requirements: "Must follow Conventional Commits specification: type(scope): description. Types: feat, fix, docs, style, refactor, perf, test, build, ci, chore. Scopes: cli, db, tls, csv, json, tsv, config, ci, deps."
    description:
      mode: warning
    issue_assessment:
      mode: warning
    custom_checks:
      - name: "credential-safety-check"
        instructions: "Verify DATABASE_URL and credentials are never logged, printed, or included in error messages. All credential handling must use redaction. Flag any direct use of connection strings in output."
      - name: "null-safety-check"
        instructions: "Verify no use of from_value::<String>() without NULL checking, which causes panics. All MySQL value conversions must handle mysql::Value::NULL explicitly using mysql_value_to_string() or mysql_value_to_json()."
      - name: "exit-code-check"
        instructions: "Verify proper structured exit codes: 0=success, 1=no rows, 2=config error, 3=connection failure, 4=query failure, 5=file I/O error. Flag any use of exit(-1) or generic exit codes."
      - name: "error-handling-check"
        instructions: "Verify proper error handling with anyhow::Result types and no panics in application code. All public APIs should return Result<T>. No unwrap() or expect() in production code paths."
  path_instructions:
    - path: "src/**"
      instructions: |
        Focus on Rust best practices, memory safety, and error handling.
        Pay special attention to:
        - Proper use of anyhow::Result for error propagation
        - Safe database value conversion (avoid panics on NULL values)
        - Feature-gated compilation patterns
        - Security: NEVER allow DATABASE_URL to appear in logs, error messages, or debug output
        - Ensure all credential handling includes proper redaction
        - Verify TLS/SSL configuration uses mysql::SslOpts programmatically
        - Flag any use of from_value::<String>() without NULL checking (causes panics)
        - Ensure mysql::Value::NULL is handled explicitly in all conversions
        - Verify 100-character line limit compliance
        - Validate proper exit code usage (not -1 or generic codes)
        - Verify CLI flags take precedence over environment variables

    - path: "**/*.rs"
      instructions: |
        Review for:
        - Clippy compliance (zero warnings tolerance)
        - Proper error handling with anyhow
        - Safe pattern matching (avoid Some(&_), use Some(_))
        - Memory efficiency and avoiding unnecessary allocations
        - Documentation for public functions

    - path: ".github/workflows/**"
      instructions: |
        Review CI/CD workflows for:
        - Security best practices (no hardcoded secrets)
        - Cross-platform compatibility
        - Proper error handling and exit codes
        - Integration with justfile commands
        - OIDC authentication usage

    - path: "Cargo.toml"
      instructions: |
        Review dependency changes for:
        - Security implications
        - Feature flag consistency
        - Version compatibility
        - Minimal dependency principle

    - path: "tests/**"
      instructions: |
        Review tests for:
        - Comprehensive coverage of edge cases
        - Proper test isolation
        - Cross-platform compatibility
        - Security test scenarios

    - path: "docs/**"
      instructions: |
        Review documentation for:
        - Clarity and completeness
        - Cross-platform compatibility
        - Ease of use and usability
        - Security best practices

    - path: "justfile"
      instructions: |
        Review build automation for:
        - Cross-platform compatibility
        - Developer experience
        - CI parity with just ci-check
  tools:
    ast-grep:
      rule_dirs: []
      util_dirs: []
      essential_rules: true
      packages: []
    shellcheck:
      enabled: true
    ruff:
      enabled: false
    markdownlint:
      enabled: true
    github-checks:
      enabled: true
      timeout_ms: 120000
    languagetool:
      enabled: true
      enabled_rules: []
      disabled_rules: []
      enabled_categories: []
      disabled_categories: []
      enabled_only: false
      level: default
    biome:
      enabled: false
    hadolint:
      enabled: false
    swiftlint:
      enabled: false
    phpstan:
      enabled: false
    golangci-lint:
      enabled: false
    yamllint:
      enabled: true
    gitleaks:
      enabled: true
    checkov:
      enabled: false
    detekt:
      enabled: false
    eslint:
      enabled: false
    flake8:
      enabled: false
    rubocop:
      enabled: false
    buf:
      enabled: false
    regal:
      enabled: false
    actionlint:
      enabled: true
    pmd:
      enabled: false
    cppcheck:
      enabled: false
    semgrep:
      enabled: true
    circleci:
      enabled: false
    clippy:
      enabled: true
    sqlfluff:
      enabled: true
    pylint:
      enabled: false
    oxc:
      enabled: false

chat:
  auto_reply: true

knowledge_base:
  opt_out: false
  web_search:
    enabled: true
  code_guidelines:
    enabled: true
    filePatterns: []
  learnings:
    scope: auto
  issues:
    scope: local
  pull_requests:
    scope: local
  mcp:
    usage: enabled
    disabled_servers: []

code_generation:
  docstrings:
    language: en-US
    path_instructions:
      - path: "src/**/*.rs"
        instructions: |
          Generate comprehensive Rust doc comments for all public functions, structs, and modules.
          Include:
          - Clear description of purpose and behavior
          - Arguments section with parameter descriptions
          - Returns section describing the return value
          - Example section with code examples when helpful
          - Error conditions and when errors are returned
          Follow Rust documentation conventions and use proper markdown formatting.
  unit_tests:
    path_instructions:
      - path: "tests/**/*.rs"
        instructions: |
          Generate comprehensive unit tests following Rust testing best practices.
          Include:
          - Tests for happy paths and edge cases
          - Tests for error conditions
          - Tests for NULL value handling in database conversions
          - Tests for security scenarios (credential redaction, TLS configuration)
          - Cross-platform compatibility tests where applicable
          Use testcontainers for integration tests with real MySQL/MariaDB instances.

issue_enrichment:
  auto_enrich:
    enabled: true
  planning:
    enabled: true

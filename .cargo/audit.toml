# cargo-audit configuration
# See: https://rustsec.org/

[advisories]
# Ignore warnings for unmaintained/unsound transitive dependencies
# These come from the mysql crate and its dependencies, which we cannot directly control
ignore = [
    # rustls-pemfile is unmaintained but still pulled by mysql and testcontainers
    # We've removed our direct dependency; waiting for upstream to update
    "RUSTSEC-2025-0134",

    # lru unsoundness in IterMut - transitive via mysql crate
    # We don't use IterMut on lru directly; waiting for mysql to update
    "RUSTSEC-2026-0002",

    # rand 0.9.2 unsoundness with custom logger using rand::rng()
    # Transitive via proptest (test-only) and bollard -> testcontainers (test-only).
    # We don't ship rand and don't install custom loggers in tests.
    "RUSTSEC-2026-0097",

    # proc-macro-error2 is unmaintained (no patched version exists).
    # Transitive via mysql_common -> mysql-common-derive (proc-macro); a
    # build-time dependency we cannot directly control and which is not shipped
    # in the binary. Waiting for mysql to drop it.
    "RUSTSEC-2026-0173",
]

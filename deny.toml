# cargo-deny configuration for DaemonEye
# See: https://embarkstudios.github.io/cargo-deny/

[graph]
targets = [
    "aarch64-apple-darwin",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "x86_64-pc-windows-msvc",
]
all-features = true
exclude-dev = true

[licenses]
unused-allowed-license = "allow"
# Allow common open source licenses used in the Rust ecosystem
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "CC0-1.0",
    "MIT",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
    "OpenSSL",
    "CDLA-Permissive-2.0",
]
include-dev = true

# Confidence threshold for license detection
confidence-threshold = 0.8

[bans]
multiple-versions = "deny"
wildcards = 'deny'
deny = [
    { crate = "git2", use-instead = "gix" },
    { crate = "openssl", use-instead = "rustls" },
    { crate = "openssl-sys", use-instead = "rustls" },
    "libssh2-sys",
    # { crate = "cmake", use-instead = "cc" },  # Commented out - needed by rustls
]
skip = [
    # Allow multiple versions of getrandom - required by different crypto libraries
    { crate = "getrandom", versions = ["0.2.16", "0.3.4"], reason = "Required by different crypto libraries (ring vs jobserver)" },
    # Allow multiple versions of windows-sys - required by different Windows libraries  
    { crate = "windows-sys", versions = ["0.52.0", "0.61.2"], reason = "Required by different Windows libraries (socket2 vs anstyle)" },
]
skip-tree = []


[advisories]
yanked = "deny"
unmaintained = "workspace"
ignore = []

[sources]
# Allow crates from crates.io
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

[sources.allow-org]
# Allow specific organizations for git sources if needed
github = []
gitlab = []
bitbucket = []

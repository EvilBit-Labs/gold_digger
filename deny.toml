# cargo-deny configuration for Gold Digger
# See: https://embarkstudios.github.io/cargo-deny/
# Single config used by both local development and CI

[graph]
targets = [
    "aarch64-apple-darwin",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "x86_64-pc-windows-msvc",
]
all-features = true
exclude-dev = true

[licenses]
unused-allowed-license = "allow"
include-dev = true
confidence-threshold = 0.8
# Allow common open source licenses used in the Rust ecosystem
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "OpenSSL",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Unlicense",
    "Zlib",
]

# Manual license clarifications for crates that ship a LICENSE file but do
# not set the `license` field in their Cargo.toml manifest.
[[licenses.clarify]]
crate = "webpki@0.22.4"
expression = "ISC"
license-files = [{ path = "LICENSE", hash = 0x001c7e6c }]

[bans]
multiple-versions = "deny"
wildcards = 'deny'
deny = [
    { crate = "git2", use-instead = "gix" },
    { crate = "openssl", use-instead = "rustls" },
    { crate = "openssl-sys", use-instead = "rustls" },
    "libssh2-sys",
    # { crate = "cmake", use-instead = "cc" },  # Commented out - needed by rustls
]
skip = [
    # Allow multiple versions of getrandom - required by different crypto libraries
    { crate = "getrandom", versions = ["0.2.16", "0.3.4"], reason = "Required by different crypto libraries (ring vs jobserver)" },
    # owo-colors 4.3 depends on both supports-color 2.x (via is-terminal) and
    # 3.x (direct). Until upstream consolidates we tolerate both — the whole
    # subtree is only compiled for our ANSI-capable stderr path and the
    # binary size delta is negligible. Tracks todo #161.
    { crate = "supports-color", versions = ["2.1.0", "3.0.2"], reason = "owo-colors 4.3 transitively pulls two versions; overhead is negligible and upstream consolidation is pending (todo #161)" },
    # windows-sys 0.52 comes in via is-terminal (supports-color 2.x),
    # 0.61 is pulled by clap/console/tracing-subscriber/etc. Forcing a
    # single version would require a workspace-wide pin; the two copies
    # only ship on Windows targets anyway and the binary is not
    # size-critical there. Tracks todo #161 / #162.
    { crate = "windows-sys", versions = ["0.52.0", "0.61.2"], reason = "Transitive-only divergence (is-terminal vs clap / tracing / indicatif); Windows-only cost, no practical way to force a single version" },
]
skip-tree = []


[advisories]
yanked = "deny"
# "workspace" flags unmaintained direct deps we control; transitive deps
# (e.g. rustls-pemfile via mysql) are outside our control and not flagged.
unmaintained = "workspace"
ignore = []

[sources]
# Allow crates from crates.io
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

[sources.allow-org]
# Allow specific organizations for git sources if needed
github = []
gitlab = []
bitbucket = []

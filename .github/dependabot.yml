version: 2
updates:
    - package-ecosystem: github-actions
      directory: "/"
      schedule:
          interval: weekly
          day: monday
      open-pull-requests-limit: 5
      commit-message:
          prefix: "chore(deps)"
      # release.yml is generated by cargo-dist; its action SHAs are pinned via
      # [dist.github-action-commits] in dist-workspace.toml. A Dependabot bump there
      # desyncs the file from dist's pins and breaks `dist plan`. exclude-paths keeps
      # Dependabot out of release.yml only -- every other workflow still gets bumped.
      # release.yml's actions are updated by bumping cargo-dist and running `dist generate`.
      exclude-paths:
          - ".github/workflows/release.yml"
      groups:
          # Batch all minor/patch action bumps into a single PR to reduce noise.
          # Major bumps still come through as individual PRs for review.
          github-actions:
              patterns: ["*"]
              update-types: ["minor", "patch"]
    - package-ecosystem: "devcontainers"
      directory: "/"
      schedule:
          interval: weekly
      commit-message:
          prefix: "chore(deps)"
    - package-ecosystem: "cargo"
      directory: "/"
      schedule:
          interval: weekly
      commit-message:
          prefix: "chore(deps)"
      groups:
          # Security-sensitive crates (mysql*, rustls*, clap*, tokio*, serde*)
          # are intentionally excluded from grouping below so each ships as an
          # individual PR — letting us review in isolation and hold any one
          # back without rejecting the entire batch.
          # Everything else (non-security-sensitive) groups together for a
          # single weekly PR — cuts the 4-of-5 individual-bump commit noise.
          rust-deps:
              patterns: ["*"]
              exclude-patterns:
                  - "mysql*"
                  - "rustls*"
                  - "clap*"
                  - "tokio*"
                  - "serde*"
              update-types: ["minor", "patch"]

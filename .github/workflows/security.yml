name: Security

on:
    workflow_run:
        workflows: [CI]
        types: [completed]
    schedule:
        - cron: "0 6 * * *"
    workflow_dispatch:

permissions:
    contents: read
    actions: read
    security-events: write

defaults:
    run:
        shell: bash

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    audit:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
            - uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1.6.4.0.1
              with:
                  install: true
                  cache: true
                  github_token: ${{ secrets.GITHUB_TOKEN }}

            - name: Run cargo deny check
              run: cargo deny check

            - name: Run cargo outdated
              run: cargo outdated --depth=1 --exit-code=1

            - name: Generate SBOM (CycloneDX)
              run: cargo cyclonedx --format json

            - name: Upload SBOM artifact
              uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
              with:
                  name: sbom-cyclonedx
                  path: gold_digger.cdx.json

            - name: Vulnerability scan with Grype
              run: grype sbom:gold_digger.cdx.json --fail-on critical -o sarif --file grype-results.sarif

            - name: Upload Grype SARIF
              if: always() && (github.event_name != 'workflow_run' || github.event.workflow_run.head_repository.full_name == github.repository)
              uses: github/codeql-action/upload-sarif@e46ed2cbd01164d986452f91f178727624ae40d7 # v4.35.3
              with:
                  sarif_file: grype-results.sarif
                  category: grype-scan

name: Security

on:
    workflow_run:
        workflows: [CI]
        types: [completed]
    schedule:
        - cron: "0 6 * * *"
    workflow_dispatch:

permissions:
    contents: read
    actions: read
    security-events: write

defaults:
    run:
        shell: bash

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    audit:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
            - uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
              with:
                  install: true
                  cache: true
                  github_token: ${{ secrets.GITHUB_TOKEN }}

            - name: Run cargo deny check
              run: cargo deny check

            - name: Run cargo outdated
              run: cargo outdated --depth=1 --exit-code=1

            - name: Generate SBOM (CycloneDX)
              run: cargo cyclonedx --format json

            - name: Upload SBOM artifact
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: sbom-cyclonedx
                  path: gold_digger.cdx.json

            - name: Vulnerability scan with Grype
              run: grype sbom:gold_digger.cdx.json --fail-on critical -o sarif --file=grype-results.sarif

            - name: Upload Grype SARIF
              if: always() && (github.event_name != 'workflow_run' ||
                  github.event.workflow_run.head_repository.full_name ==
                  github.repository)
              uses: github/codeql-action/upload-sarif@54f647b7e1bb85c95cddabcd46b0c578ec92bc1a # v4.36.3
              with:
                  sarif_file: grype-results.sarif
                  category: grype-scan

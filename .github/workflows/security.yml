name: Security

on:
    workflow_run:
        workflows: [CI]
        types: [completed]
    schedule:
        - cron: "0 6 * * *"
    workflow_dispatch:

permissions:
    contents: read
    actions: read
    security-events: write

defaults:
    run:
        shell: bash

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    audit:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
              with:
                  install: true
                  cache: true
                  github_token: ${{ secrets.GITHUB_TOKEN }}

            - name: Run cargo deny check
              run: cargo deny check

            - name: Run cargo outdated
              run: cargo outdated --depth=1 --exit-code=1

            - name: Generate SBOM (CycloneDX)
              run: cargo cyclonedx --format json

            - name: Upload SBOM artifact
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: sbom-cyclonedx
                  path: gold_digger.cdx.json

            - name: Vulnerability scan with Grype
              run: grype sbom:gold_digger.cdx.json --fail-on critical -o sarif --file=grype-results.sarif

            - name: Upload Grype SARIF
              if: always() && (github.event_name != 'workflow_run' ||
                  github.event.workflow_run.head_repository.full_name ==
                  github.repository)
              uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
              with:
                  sarif_file: grype-results.sarif
                  category: grype-scan

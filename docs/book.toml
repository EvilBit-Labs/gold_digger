[book]
authors     = [ "EvilBit-Labs" ]
language    = "en"
src         = "src"
title       = "Gold Digger Documentation"
description = "MySQL/MariaDB query tool with structured output"

[output.html]
default-theme        = "navy"
additional-css       = [ "whichlang.css" ]
additional-js        = [ "mermaid-init.js", "whichlang.js", "mermaid.min.js" ]
preferred-dark-theme = "navy"
git-repository-url   = "https://github.com/EvilBit-Labs/gold_digger"
edit-url-template    = "https://github.com/EvilBit-Labs/gold_digger/edit/main/docs/src/{path}"

[output.html.fold]
enable = true
level  = 1

[output.html.playground]
copyable     = true
copy-js      = true
line-numbers = false
editable     = false

# TODO: Re-enable when mdbook-alerts supports mdbook 0.5.x
# See: https://github.com/lambdalisue/rs-mdbook-alerts/issues
# [preprocessor.alerts]
# command = "mdbook-alerts"

[preprocessor.mermaid]
command = "mdbook-mermaid"

[preprocessor.toc]
command  = "mdbook-toc"
marker   = "[TOC]"
renderer = [ "html" ]

[preprocessor.tabs]
command = "mdbook-tabs"

[preprocessor.links]

[output.html.search]
enable              = true
limit-results       = 30
teaser-word-count   = 30
use-boolean-and     = true
boost-title         = 2
boost-hierarchy     = 1
boost-paragraph     = 1
expand              = true
heading-split-level = 3

[output.html.print]
enable = true

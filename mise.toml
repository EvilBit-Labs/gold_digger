[tools]
cargo-binstall              = "latest"
cargo-insta                 = "1.48.0"
"cargo:cargo-audit"         = "0.22.2"
"cargo:cargo-deny"          = "0.19.9"
"cargo:git-cliff"           = "latest"
"cargo:cargo-dist"          = "0.32.0"
"cargo:cargo-llvm-cov"      = "0.8.7"
"cargo:cargo-nextest"       = "0.9.138"
"cargo:mdbook"              = "0.5.3"
"cargo:mdbook-linkcheck"    = "0.7.7"
"cargo:mdbook-tabs"         = "1.0.4"
"cargo:mdbook-mermaid"      = "0.17.0"
"cargo:mdbook-toc"          = "0.15.4"
"cargo:mdbook-admonish"     = "1.20.0"
"cargo:mdbook-open-on-gh"   = "3.0.0"
"cargo:mdbook-i18n-helpers" = "0.4.0"
just                        = "latest"
python                      = "latest"
rust                        = { version = "stable", components = "llvm-tools,cargo,rustfmt,clippy", profile = "default" }
"cargo:cargo-outdated"      = "0.19.0"
"cargo:cargo-release"       = "1.1.2"
"cargo:cargo-auditable"     = "0.7.4"
"cargo:cargo-cyclonedx"     = "0.5.9"
"pipx:mdformat"             = { version = "latest", uvx_args = "--with mdformat-gfm --with mdformat-admon --with mdformat-config --with mdformat-footnote --with mdformat-simple-breaks --with mdformat-web --with mdformat-ruff --with mdformat-gfm-alerts --with mdformat-toc --with mdformat-front-matters" }
prettier                    = "latest"
actionlint                  = "latest"
lychee                      = "0.24.2"
markdownlint-cli2           = "0.22.1"
"cargo:cargo-watch"         = "8.5.3"
grype                       = "latest"
syft                        = "latest"
act                         = { version = "0.2.89", os = [ "linux", "macos" ] }
"pipx:sqlfluff"             = "4.2.2"
docker-compose              = "latest"
docker-cli                  = "latest"
"pipx:pre-commit"           = "latest"
oxlint                      = "latest"
ruff                        = "latest"
shellcheck                  = "latest"
bun                         = "latest"

# Many of these settings are defaults, but we are explicit in case they change in the future and to make it clear to users what is enabled.
[settings]
activate_aggressive                 = true
idiomatic_version_file_enable_tools = [ "python", "rust", "bun" ]
env_cache                           = true
exec_auto_install                   = true
github_attestations                 = true
lockfile                            = true
slsa                                = true

[settings.npm]
package_manager = "bun"

[settings.pipx]
uvx = true
